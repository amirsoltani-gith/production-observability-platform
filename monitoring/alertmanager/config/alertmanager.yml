global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - instance

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  receiver: default

  routes:
    - matchers:
        - severity="critical"
      receiver: critical

    - matchers:
        - severity="warning"
      receiver: warning


inhibit_rules:
  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - alertname
      - instance


receivers:
  - name: default

  - name: critical

  - name: warning