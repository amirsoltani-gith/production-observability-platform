services:
  prometheus:
    image: prom/prometheus:v${PROMETHEUS_VERSION}
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v${ALERTMANAGER_VERSION}
    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    networks:
      - observability

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v${NODE_EXPORTER_VERSION}
    restart: unless-stopped

    ports:
      - "9100:9100"

    networks:
      - observability
    
  cadvisor:
    image: ghcr.io/google/cadvisor:v${CADVISOR_VERSION}
    restart: unless-stopped

    ports:
      - "8088:8080"

    networks:
      - observability

networks:
  observability:
    driver: bridge
